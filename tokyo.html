    // WMO Weather Interpretation Code
    function getWeatherMeta(code) {
      if (code === 0) return { status: "晴朗無雲", icon: "fa-sun", color: "text-orange-600" };
      if (code === 1 || code === 2) return { status: "晴時多雲", icon: "fa-cloud-sun", color: "text-orange-500" };
      if (code === 3) return { status: "陰天", icon: "fa-cloud", color: "text-zinc-600" };
      if (code >= 45 && code <= 48) return { status: "有霧", icon: "fa-smog", color: "text-zinc-500" };
      if (code >= 51 && code <= 67) return { status: "有雨/飄雨", icon: "fa-cloud-rain", color: "text-zinc-700" };
      if (code >= 71 && code <= 77) return { status: "降雪", icon: "fa-snowflake", color: "text-zinc-500" };
      if (code >= 80 && code <= 82) return { status: "陣雨", icon: "fa-cloud-showers-heavy", color: "text-orange-600" };
      if (code >= 95) return { status: "雷雨", icon: "fa-cloud-bolt", color: "text-orange-600" };
      return { status: "多雲", icon: "fa-cloud", color: "text-zinc-600" };
    }

    // Fetch Live Weather from Open-Meteo API
    async function fetchLiveWeather(lat, lon, targetDateStr) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("API Network error");
        const data = await res.json();

        let dateIndex = data.daily.time.indexOf(targetDateStr);
        if (dateIndex === -1) dateIndex = 0;

        const weatherCode = data.daily.weathercode[dateIndex];
        const maxTemp = Math.round(data.daily.temperature_2m_max[dateIndex]);
        const minTemp = Math.round(data.daily.temperature_2m_min[dateIndex]);
        const meta = getWeatherMeta(weatherCode);

        return {
          status: meta.status,
          temp: `${maxTemp}°C / ${minTemp}°C`,
          icon: meta.icon,
          color: meta.color,
          desc: `（即時天氣資料）`
        };
      } catch (err) {
        console.warn("即時天氣載入失敗:", err);
        return {
          status: "多雲/載入中",
          temp: "32°C / 25°C",
          icon: "fa-cloud-sun",
          color: "text-orange-500",
          desc: "即時氣象資料更新中"
        };
      }
    }

          return `<span class="bg-zinc-900 text-white text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5"><i class="fa-solid fa-plane text-orange-500 text-[10px]"></i> 航班/機場</span>`;
        case 'food':
          return `<span class="bg-orange-600 text-white text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5"><i class="fa-solid fa-utensils text-[10px]"></i> 美食饗宴</span>`;
        case 'spot':
          return `<span class="bg-zinc-800 text-zinc-100 text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5"><i class="fa-solid fa-camera text-orange-500 text-[10px]"></i> 景點逛街</span>`;
        case 'transport':
          return `<span class="bg-zinc-200 text-zinc-900 text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5 border border-zinc-300"><i class="fa-solid fa-train text-orange-600 text-[10px]"></i> 交通移動</span>`;
        case 'hotel':
          return `<span class="bg-zinc-900 text-orange-500 text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5 border border-zinc-700"><i class="fa-solid fa-hotel text-[10px]"></i> 飯店/行李</span>`;
        case 'shop':
          return `<span class="bg-zinc-100 text-zinc-900 text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5 border border-zinc-300"><i class="fa-solid fa-bag-shopping text-orange-600 text-[10px]"></i> 購物採買</span>`;
        case 'ticket':
          return `<span class="bg-zinc-800 text-orange-400 text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5"><i class="fa-solid fa-ticket text-[10px]"></i> 票券/購票</span>`;
        default:
          return `<span class="bg-zinc-200 text-zinc-800 text-xs px-2.5 py-1 font-bold uppercase inline-flex items-center gap-1.5"><i class="fa-regular fa-clock text-[10px]"></i> 行程日程</span>`;
      }
    }

    // Open Google Maps
    function openMap(query) {
      if (!query) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // Switch Tab Logic
    function switchTab(dayKey, autoScroll = false) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-orange-600', 'text-white', 'border-orange-600');
        btn.classList.add('bg-white', 'text-zinc-700', 'border-zinc-300');
        
        // Reset child text colors to ensure hover consistency
        const titleEl = btn.querySelector('.font-black');
        const descEl = btn.querySelector('.text-\\[11px\\]');
        if (titleEl) {
          titleEl.classList.remove('text-white');
          titleEl.classList.add('text-zinc-900');
        }
        if (descEl) {
          descEl.classList.remove('text-white');
          descEl.classList.add('text-zinc-500');
        }
      });

      const activeBtn = document.getElementById(`tab-${dayKey}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-zinc-700', 'border-zinc-300');
        activeBtn.classList.add('bg-orange-600', 'text-white', 'border-orange-600');

        const titleEl = activeBtn.querySelector('.font-black');
        const descEl = activeBtn.querySelector('.text-\\[11px\\]');
        if (titleEl) {
          titleEl.classList.remove('text-zinc-900');
          titleEl.classList.add('text-white');
        }
        if (descEl) {
          descEl.classList.remove('text-zinc-500');
          descEl.classList.add('text-white');
        }
      }

      renderDay(dayKey, autoScroll);
    }

    // Render Timeline Content
    async function renderDay(dayKey, autoScroll = false) {
      const data = scheduleData[dayKey];
      const weatherBar = document.getElementById('weather-bar');
      const timelineContainer = document.getElementById('timeline-container');

      // Calculate current time in minutes
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();

      // Weather loading skeleton
      weatherBar.innerHTML = `
        <div class="bg-white p-6 border-2 border-zinc-300 flex justify-between items-center animate-pulse">
          <div class="h-8 bg-zinc-200 w-64"></div>
          <div class="h-8 bg-zinc-200 w-32"></div>
        </div>
      `;

      let targetScrollId = null;

      // Render Timeline Items
      let html = '';
      data.items.forEach((item) => {
        const hasMap = Boolean(item.mapQuery);
        
        // Check if item is active based on current time
        const isCurrent = currentMin >= item.startMin && currentMin < item.endMin;
        if (isCurrent || (!targetScrollId && currentMin < item.startMin)) {
          if (!targetScrollId) targetScrollId = item.id;
        }

        const activeStyles = isCurrent 
          ? 'border-orange-600 shadow-lg shadow-orange-600/10 border-l-8' 
          : 'border-zinc-200 hover:border-zinc-900';

        html += `
          <div id="${item.id}" class="bg-white p-6 border-2 ${activeStyles} transition-all duration-200 flex flex-col md:flex-row justify-between gap-4">
            
            <!-- Main Content Area -->
            <div class="flex-grow">
              <!-- Category Badge & Extra Info -->
              <div class="flex flex-wrap items-center gap-2 mb-3">
                ${getCategoryBadge(item.category)}
                ${isCurrent ? `<span class="bg-orange-600 text-white text-[10px] font-black uppercase px-2 py-0.5 tracking-widest animate-pulse">● CURRENT</span>` : ''}
              </div>

              <!-- TIME AS MAIN HEADER (Large & Bold) -->
              <h2 class="text-2xl sm:text-3xl font-black text-orange-600 tracking-tight font-mono">
                ${item.time}
              </h2>

              <!-- Activity Title -->
              <h3 class="text-lg sm:text-xl font-bold text-zinc-900 mt-1 tracking-tight">
                ${item.title}
              </h3>

              <!-- Description -->
              <p class="text-sm text-zinc-600 mt-2 leading-relaxed font-normal">
                ${item.desc}
              </p>
            </div>

            <!-- Action Area (Map Button) -->
            ${hasMap ? `
              <div class="flex md:flex-col justify-end md:justify-center items-start md:items-end flex-shrink-0 pt-3 md:pt-0 border-t md:border-t-0 md:border-l border-zinc-200 md:pl-6">
                <button type="button" onclick="openMap('${item.mapQuery.replace(/'/g, "\\'")}')" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 text-xs font-bold text-white bg-zinc-900 hover:bg-orange-600 px-4 py-3 transition-colors cursor-pointer uppercase tracking-wider">
                  <i class="fa-solid fa-location-dot text-orange-500"></i>
                  <span>導航地圖</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1 opacity-70"></i>
                </button>
              </div>
            ` : ''}

          </div>
        `;
      });

      timelineContainer.innerHTML = html;

      // Fetch Real-time Weather
      const weatherInfo = await fetchLiveWeather(data.lat, data.lon, data.dateStr);

      // WHITE BACKGROUND WEATHER BAR WITH ENLARGED MAIN HEADER
      weatherBar.innerHTML = `
        <div class="bg-white text-zinc-900 p-6 border-2 border-zinc-900 border-l-8 border-l-orange-600 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-sm">
          <div>
            <h2 class="text-2xl sm:text-3xl font-black text-zinc-950 tracking-tight uppercase">${data.title}</h2>
            <p class="text-xs sm:text-sm text-zinc-500 mt-1 font-bold">地點：${data.locationName} ${weatherInfo.desc}</p>
          </div>
          <div class="flex items-center gap-3 bg-zinc-100 px-4 py-3 border border-zinc-300 self-stretch sm:self-auto justify-between sm:justify-start">
            <div class="flex items-center gap-2.5">
              <i class="fa-solid ${weatherInfo.icon} text-2xl ${weatherInfo.color}"></i>
              <span class="text-sm font-black text-zinc-900">${weatherInfo.status}</span>
            </div>
            <span class="text-zinc-300 font-light">|</span>
            <span class="text-sm font-black text-orange-600 font-mono tracking-tight">${weatherInfo.temp}</span>
          </div>
        </div>
      `;

      // Auto Scroll to Current/Next Time Slot
      if (autoScroll && targetScrollId) {
        setTimeout(() => {
          const el = document.getElementById(targetScrollId);
          if (el) {
            const yOffset = -100; // Header offset
            const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
            window.scrollTo({ top: y, behavior: 'smooth' });
          }
        }, 150);
      }
    }

    // Auto-detect Today's Schedule on First Load
    window.onload = function() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      
      let initialDayKey = 'day1'; // Default

      // Match 8/25~8/29
      if (month === 8) {
        if (date === 25) initialDayKey = 'day0';
        else if (date === 26) initialDayKey = 'day1';
        else if (date === 27) initialDayKey = 'day2';
        else if (date === 28) initialDayKey = 'day3';
        else if (date === 29) initialDayKey = 'day4';
      }

      switchTab(initialDayKey, true);
    };
  </script>
</body>
</html>
