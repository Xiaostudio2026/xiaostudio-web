    // WMO Weather Interpretation Code
    function getWeatherMeta(code) {
      if (code === 0) return { status: "晴朗無雲", icon: "fa-sun", color: "text-amber-500" };
      if (code === 1 || code === 2) return { status: "晴時多雲", icon: "fa-cloud-sun", color: "text-amber-400" };
      if (code === 3) return { status: "陰天", icon: "fa-cloud", color: "text-slate-400" };
      if (code >= 45 && code <= 48) return { status: "有霧", icon: "fa-smog", color: "text-slate-400" };
      if (code >= 51 && code <= 67) return { status: "有雨/飄雨", icon: "fa-cloud-rain", color: "text-blue-400" };
      if (code >= 71 && code <= 77) return { status: "降雪", icon: "fa-snowflake", color: "text-sky-300" };
      if (code >= 80 && code <= 82) return { status: "陣雨", icon: "fa-cloud-showers-heavy", color: "text-blue-500" };
      if (code >= 95) return { status: "雷雨", icon: "fa-cloud-bolt", color: "text-purple-500" };
      return { status: "多雲", icon: "fa-cloud", color: "text-slate-400" };
    }

    async function fetchLiveWeather(lat, lon, targetDateStr) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("API Network error");
        const data = await res.json();

        let dateIndex = data.daily.time.indexOf(targetDateStr);
        if (dateIndex === -1) dateIndex = 0; // Fallback to current forecast

        const weatherCode = data.daily.weathercode[dateIndex];
        const maxTemp = Math.round(data.daily.temperature_2m_max[dateIndex]);
        const minTemp = Math.round(data.daily.temperature_2m_min[dateIndex]);
        const meta = getWeatherMeta(weatherCode);

        return {
          status: meta.status,
          temp: `${maxTemp}°C / ${minTemp}°C`,
          icon: meta.icon,
          color: meta.color,
          desc: `（即時資料來源：Open-Meteo 氣象預報）`
        };
      } catch (err) {
        console.warn("即時天氣載入失敗:", err);
        return {
          status: "多雲/氣象載入中",
          temp: "32°C / 25°C",
          icon: "fa-cloud-sun",
          color: "text-blue-500",
          desc: "即時氣象資料更新中"
        };
      }
    }

    // Category Badge Function
    function getCategoryBadge(category) {
      switch (category) {
        case 'flight':
          return `<span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-solid fa-plane"></i> 航班/機場</span>`;
        case 'food':
          return `<span class="bg-orange-100 text-orange-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-solid fa-utensils"></i> 美食饗宴</span>`;
        case 'spot':
          return `<span class="bg-purple-100 text-purple-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-solid fa-camera"></i> 景點逛街</span>`;
        case 'transport':
          return `<span class="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-solid fa-train"></i> 交通移動</span>`;
        case 'hotel':
          return `<span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-solid fa-hotel"></i> 飯店/行李</span>`;
        case 'shop':
          return `<span class="bg-pink-100 text-pink-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-solid fa-bag-shopping"></i> 購物採買</span>`;
        case 'ticket':
          return `<span class="bg-teal-100 text-teal-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-solid fa-ticket"></i> 票券/購票</span>`;
        default:
          return `<span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-0.5 rounded-full font-medium inline-flex items-center gap-1"><i class="fa-regular fa-clock"></i> 行程日程</span>`;
      }
    }

    // Open Google Maps
    function openMap(query) {
      if (!query) return;
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // Switch Tab
    function switchTab(dayKey) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-sm');
        btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
      });

      const activeBtn = document.getElementById(`tab-${dayKey}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-sm');
      }

      renderDay(dayKey);
    }

    // Render Timeline Content
    async function renderDay(dayKey) {
      const data = scheduleData[dayKey];
      const weatherBar = document.getElementById('weather-bar');
      const timelineContainer = document.getElementById('timeline-container');

      // Weather loading skeleton
      weatherBar.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex justify-between items-center animate-pulse">
          <div class="h-6 bg-slate-200 rounded w-48"></div>
          <div class="h-8 bg-slate-200 rounded w-32"></div>
        </div>
      `;

      // Render Timeline Items
      let html = '';
      data.items.forEach((item) => {
        const hasMap = Boolean(item.mapQuery);
        const imgUrl = item.image || 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=500&auto=format&fit=crop&q=80';

        html += `
          <div class="relative flex flex-col md:flex-row gap-4 bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all">
            <div class="w-full md:w-36 h-32 md:h-auto flex-shrink-0 rounded-xl overflow-hidden bg-slate-100 relative group">
              <img 
                src="${imgUrl}" 
                alt=""
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=500&auto=format&fit=crop&q=80';"
              />
            </div>
            <div class="flex-grow flex flex-col justify-between">
              <div>
                <div class="flex flex-wrap items-center gap-2 mb-2">
                  <span class="text-xs sm:text-sm font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">
                    ${item.time}
                  </span>
                  ${getCategoryBadge(item.category)}
                </div>
                <h3 class="text-base sm:text-lg font-bold text-slate-800">
                  ${item.title}
                </h3>
                <p class="text-xs sm:text-sm text-slate-600 mt-1 leading-relaxed">
                  ${item.desc}
                </p>
              </div>
              ${hasMap ? `
                <div class="mt-3">
                  <button type="button" onclick="openMap('${item.mapQuery.replace(/'/g, "\\'")}')" class="inline-flex items-center gap-1.5 text-xs font-medium text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg border border-blue-200 transition-colors cursor-pointer">
                    <i class="fa-solid fa-location-dot text-red-500"></i>
                    <span>地圖導航：${item.mapQuery}</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-0.5 opacity-70"></i>
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });

      timelineContainer.innerHTML = html;

      // Fetch Real-time Weather
      const weatherInfo = await fetchLiveWeather(data.lat, data.lon, data.dateStr);

      weatherBar.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <div>
            <h2 class="text-xl font-bold text-slate-900">${data.title}</h2>
            <p class="text-xs text-slate-500 mt-1">地點：${data.locationName} ${weatherInfo.desc}</p>
          </div>
          <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100 self-stretch sm:self-auto justify-between">
            <div class="flex items-center gap-2">
              <i class="fa-solid ${weatherInfo.icon} text-2xl ${weatherInfo.color}"></i>
              <span class="text-sm font-semibold text-slate-700">${weatherInfo.status}</span>
            </div>
            <span class="text-sm font-bold text-slate-900 bg-white px-2.5 py-1 rounded-md shadow-xs border border-slate-200">${weatherInfo.temp}</span>
          </div>
        </div>
      `;
    }

    // Initialize View
    window.onload = function() {
      renderDay('day1');
    };
  </script>
</body>
</html>
