    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #000000;
            scroll-behavior: smooth;
        }

        /* 滾動動畫效果定義 */
        .reveal-item {
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        /* 各種動畫進入方向 */
        .fade-in-up {
            transform: translateY(40px);
        }

        .slide-in-left {
            transform: translateX(-40px);
        }

        .slide-in-right {
            transform: translateX(40px);
        }

        /* 當元素進入視口時啟動動畫 */
        .reveal-item.is-visible {
            opacity: 1;
            transform: translate(0, 0);
        }

        /* 圖片容器與懸停縮放效果 */
        .image-container {
            overflow: hidden;
            background-color: #f7f7f7;
            border-radius: 4px;
            scroll-margin-top: 80px; /* 滾動定位時保留上方間距，避免貼頂 */
        }

        .project-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .image-container:hover .project-image {
            transform: scale(1.02);
        }

        /* 頁首主視覺動畫 */
        .hero-reveal {
            opacity: 0;
            transform: scale(1.05);
            transition: transform 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
        }

        .hero-reveal.is-visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>

    <script>
        // 設定 Intersection Observer 參數
        const observerOptions = { 
            threshold: 0.05, 
            rootMargin: "0px 0px -100px 0px" 
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target); // 觸發後即停止監聽，避免重複動畫
                }
            });
        }, observerOptions);

        window.onload = () => {
            // 監聽主視覺與所有展示區塊
            document.querySelectorAll('.hero-reveal, .reveal-item').forEach(el => {
                observer.observe(el);
            });
        };

        // 平滑滾動至指定的圖片
        function scrollToImage(index) {
            const element = document.getElementById(`project-img-${index}`);
            if (element) {
                element.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
            }
        }
    </script>
