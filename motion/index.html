    <!-- 安全防護動態提示框 -->
    <div id="security-toast">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>

    <!-- 腳本區 -->
    <script>
        /**
         * XIAOSTUDIO 防護與核心邏輯系統
         */

        // =========================================
        // 1. 禁止下載與複製安全防護引擎 (Security Module)
        // =========================================
        const SecurityGuard = {
            toastTimeout: null,

            init() {
                this.disableContextMenu();
                this.disableDragAndDrop();
                this.disableShortcuts();
                this.preventPrintScreen();
            },

            showToast(message) {
                const toast = document.getElementById('security-toast');
                const msgEl = document.getElementById('toast-message');
                if (!toast || !msgEl) return;

                msgEl.innerText = message || 'PROTECTED // CONTENT DOWNLOAD DISABLED';
                toast.classList.add('active');

                if (this.toastTimeout) clearTimeout(this.toastTimeout);
                this.toastTimeout = setTimeout(() => {
                    toast.classList.remove('active');
                }, 2500);
            },

            disableContextMenu() {
                // 阻擋右鍵選單
                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this.showToast('RIGHT CLICK DISABLED // 內容受著作權保護');
                    return false;
                }, false);
            },

            disableDragAndDrop() {
                // 阻擋圖片/媒體拖曳
                document.addEventListener('dragstart', (e) => {
                    e.preventDefault();
                    this.showToast('DRAG & DROP DISABLED // 禁止拖曳下載');
                    return false;
                }, false);
            },

            disableShortcuts() {
                // 阻擋鍵盤組合鍵 (DevTools, 另存新檔, 檢視原始碼, 列印等)
                document.addEventListener('keydown', (e) => {
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const ctrlOrCmd = isMac ? e.metaKey : e.ctrlKey;
                    const keyCode = e.keyCode || e.which;

                    // F12 (DevTools)
                    if (keyCode === 123) {
                        e.preventDefault();
                        this.showToast('DEVTOOLS ACCESS RESTRICTED // 開發者工具已關閉');
                        return false;
                    }

                    if (ctrlOrCmd) {
                        // S: 另存新檔, U: 檢視原始碼, P: 列印
                        if (keyCode === 83 || keyCode === 85 || keyCode === 80) {
                            e.preventDefault();
                            this.showToast('SAVING/PRINTING DISABLED // 禁止下載與列印');
                            return false;
                        }

                        // Shift + I / J / C (開啟檢查元素與 Console)
                        if (e.shiftKey && (keyCode === 73 || keyCode === 74 || keyCode === 67)) {
                            e.preventDefault();
                            this.showToast('DEVTOOLS ACCESS RESTRICTED // 開發者工具已關閉');
                            return false;
                        }

                        // A: 全選, C: 複製
                        if (keyCode === 65 || keyCode === 67) {
                            // 允許在輸入框內正常鍵入，其他區域禁止全選複製
                            if (!['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                                e.preventDefault();
                                this.showToast('COPYING DISABLED // 禁止複製');
                                return false;
                            }
                        }
                    }
                }, false);
            },

            preventPrintScreen() {
                // 當按下 PrintScreen 鍵時清空剪貼簿 (對部分系統提供基本干擾)
                window.addEventListener('keyup', (e) => {
                    if (e.key === 'PrintScreen') {
                        navigator.clipboard.writeText('');
                        this.showToast('SCREENSHOT DETECTED // 圖片受到保護');
                    }
                });
            }
        };

        // =========================================
        // 2. Portfolio Core Logic (原本的核心邏輯)
        // =========================================
        const Portfolio = {
            elements: {
                header: document.getElementById('main-header'),
                masthead: document.querySelector('.masthead-border'),
                overlay: document.getElementById('project-overlay'),
                iframe: document.getElementById('project-iframe'),
                cards: document.querySelectorAll('.project-card')
            },

            init() {
                this.bindEvents();
                this.setupIntersectionObserver();
            },

            bindEvents() {
                this.elements.cards.forEach(card => {
                    // 支持 <a> 標籤與普通的 <div> 點擊觸發
                    card.addEventListener('click', (e) => {
                        const href = card.getAttribute('href');
                        if (href) {
                            e.preventDefault();
                            this.open(href);
                        }
                    });
                });

                window.addEventListener('resize', () => {
                    if (this.elements.overlay.classList.contains('active')) {
                        this.updateOverlayPosition();
                    }
                });
            },

            setupIntersectionObserver() {
                const options = {
                    threshold: 0.01,
                    rootMargin: '200px 0px'
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const card = entry.target;
                            card.classList.add('is-visible');
                            
                            const placeholder = card.querySelector('.auto-thumb');
                            const assetUrl = card.getAttribute('data-thumb');
                            
                            if (placeholder && assetUrl && !placeholder.dataset.loaded) {
                                this.loadAsset(placeholder, assetUrl, card);
                            }
                        }
                    });
                }, options);

                this.elements.cards.forEach(card => observer.observe(card));
            },

            /**
             * 資源加載處理：自動偵測圖片或影片 (帶下載保護屬性)
             */
            loadAsset(placeholder, url, card) {
                const isVideo = url.match(/\.(mp4|webm|ogg)$/i);
                
                if (isVideo) {
                    const video = document.createElement('video');
                    video.className = placeholder.className;
                    video.src = url;
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    video.setAttribute('muted', '');
                    video.setAttribute('controlsList', 'nodownload noplaybackrate'); // 停用下載選單
                    video.setAttribute('disablePictureInPicture', 'true'); // 停用畫中畫
                    video.setAttribute('oncontextmenu', 'return false;');
                    
                    // 安全播放函式，隱藏瀏覽器省電模式或切頁引起的 AbortError
                    const safePlay = () => {
                        const playPromise = video.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch(() => {
                                // 忽略省電模式或背景頁面暫停媒體導致的控制台錯誤
                            });
                        }
                    };

                    // --- 5秒循環邏輯 ---
                    video.addEventListener('timeupdate', function() {
                        if (this.currentTime >= 5) {
                            this.currentTime = 0;
                            safePlay();
                        }
                    });
                    
                    video.oncanplay = () => {
                        safePlay();
                        this.finalizeLoading(placeholder, video, card);
                    };
                    
                    video.onerror = () => this.handleError(card);
                    
                    placeholder.parentNode.replaceChild(video, placeholder);
                } else {
                    placeholder.src = url;
                    placeholder.setAttribute('oncontextmenu', 'return false;');
                    placeholder.onload = () => {
                        this.finalizeLoading(null, placeholder, card);
                    };
                    placeholder.onerror = () => this.handleError(card);
                }
            },

            finalizeLoading(oldEl, newEl, card) {
                newEl.classList.add('loaded');
                newEl.dataset.loaded = "true";
                const shimmer = card.querySelector('.loading-shimmer');
                if (shimmer) shimmer.style.display = 'none';
            },

            handleError(card) {
                const shimmer = card.querySelector('.loading-shimmer');
                if (shimmer) shimmer.style.background = '#e0e0e0';
            },

            open(url) {
                this.updateOverlayPosition();
                this.elements.iframe.src = url;
                this.elements.overlay.classList.add('active');
                this.elements.overlay.setAttribute('aria-hidden', 'false');
                document.body.classList.add('no-scroll');
            },

            close() {
                this.elements.overlay.classList.remove('active');
                this.elements.overlay.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('no-scroll');
                setTimeout(() => { this.elements.iframe.src = ''; }, 600);
            },

            updateOverlayPosition() {
                if (this.elements.masthead) {
                    const rect = this.elements.masthead.getBoundingClientRect();
                    this.elements.overlay.style.top = rect.top + 'px';
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            SecurityGuard.init();
            Portfolio.init();
        });
    </script>
