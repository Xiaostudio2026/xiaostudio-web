<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoStudio | Print Works</title>
    
    <!-- 1. 外部資源：Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 外部資源：Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    
    <!-- 3. 修正路徑：指向上一層目錄的 CSS -->
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="p-8 md:p-12 lg:p-16">

    <!-- 雜誌編排風格 Header -->
    <header class="mb-8 md:mb-12">
        <div class="flex justify-between items-end mb-2 mono-text text-[10px] md:text-[11px] font-bold tracking-widest uppercase text-black">
            <div>NODE_03 // 2026 ISSUE</div>
            <div class="hidden md:block">XIAOSTUDIO ARCHIVE</div>
            <div>MOTION PROJECTS</div>
        </div>
        
        <div class="masthead-border">
            <div class="flex items-center justify-center md:justify-start">
                <h1 class="text-[9vw] md:text-7xl lg:text-9xl font-[900] tracking-[-0.05em] uppercase text-black leading-none">
                   MOTION<span class="ampersand mx-[-0.05em] md:mx-[-0.02em] text-[0.85em] align-[0.05em]">&</span>VIDEO
                </h1>
            </div>
        </div>
        
        <div class="mt-4 flex justify-between mono-text text-[9px] md:text-[10px] font-medium tracking-wider text-black-400 uppercase">
            <span>CRAFTING DYNAMIC VISUAL NARRATIVES</span>
            <span>Vol. 001</span>
        </div>
    </header>

    <!-- 作品網格區 -->
    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
        <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/video/upload/f_auto,q_auto/v1772698837/JA_CNY_2026_1920_S_clafj2.mp4">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-asset auto-thumb ">
                </div>
            </div>

            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/video/upload/f_auto,q_auto/v1772784088/JA_Xmas_1920_30s_S_fxxm7k.mp4">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-asset auto-thumb ">
                </div>
            </div>
            
            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/video/upload/f_auto,q_auto/v1772784306/Rose_2026_1920_V2_S_vi7flu.mp4">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-asset auto-thumb ">
                </div>
            </div>

            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/video/upload/f_auto,q_auto/v1777530646/Rainy_1920_2_tvx5aw.mp4">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                   <img src="" alt="Project Preview" class="project-asset auto-thumb w-full h-full object-cover">
                </div>
            </div>

            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/video/upload/f_auto,q_auto/v1772788390/Tea_Tree_Series_Video_2025_S_axtnpq.mp4">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-asset auto-thumb ">
                </div>
            </div>
        </main>
    </div>

    <!-- 專案展示視窗 -->
    <aside id="project-overlay" aria-hidden="true">
        <div class="project-modal-content">
            <button class="close-project-btn" onclick="Portfolio.close()" aria-label="關閉專案">✕</button>
            <iframe id="project-iframe" src="" frameborder="0" title="專案詳情內容"></iframe>
        </div>
    </aside>

    <!-- 4. 修正路徑：指向上一層目錄的 JS -->
    <script src="../assets/script.js"></script>
</body>
</html>
