<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoStudio | Print Works</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <style>
        /* 基礎設定與字體 */
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #ffffff; 
            overflow-x: hidden; 
            margin: 0; 
            padding: 2rem 2rem 8rem 2rem;
            color: #000;
        }
        
        @media (min-width: 768px) {
            body { padding: 3rem 3rem 12rem 3rem; }
        }
        @media (min-width: 1024px) {
            body { padding: 4rem 4rem 16rem 4rem; } 
        }

        .mono-text { font-family: 'JetBrains Mono', monospace; }
        .ampersand { font-family: 'Fraunces', serif; font-weight: 600; font-style: normal; text-transform: none; }

        /* 內容容器 */
        .content-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* 標題區域裝飾線 */
        .masthead-border { 
            border-top: 1px solid #000; 
            border-bottom: 1px solid #000; 
            padding: 0.2rem 0;
            margin: 0.5rem 0;
        }

        @media (min-width: 768px) {
            .masthead-border { padding: 1.25rem 0; }
        }
        
        /* 專案卡片樣式 */
        .project-card {
            position: relative;
            display: block;
            overflow: hidden;
            background-color: #f3f3f3;
            transition: all 0.5s ease;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
        }
        
        /* 揭示動畫 */
        .project-card.reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .project-image-container {
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .project-image.loaded { opacity: 1; }
        .project-card:hover .project-image { transform: scale(1.05); }

        /* 載入閃爍動畫 */
        .loading-shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #f3f3f3 25%, #ececec 50%, #f3f3f3 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            z-index: 1;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 專案展開視窗 (Overlay) */
        #project-overlay {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #fff;
            z-index: 500;
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            visibility: hidden;
        }

        #project-overlay.active {
            transform: translateX(0);
            visibility: visible;
        }

        .project-modal-content {
            width: 100%;
            max-width: 1400px; 
            height: 100%;
            position: relative;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 0 2rem; 
        }

        @media (min-width: 768px) { .project-modal-content { padding: 0 3rem; } }
        @media (min-width: 1024px) { .project-modal-content { padding: 0 4rem; } }

        /* 關閉按鈕 */
        .close-project-btn {
            position: absolute;
            top: -20px; 
            right: 2rem; 
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 601;
            transition: all 0.3s ease;
        }

        .close-project-btn:hover {
            background: #000000;
            color: #ffffff;
            transform: rotate(90deg);
        }

        #project-iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: #fff;
            border-top: 1px solid #000;
        }

        .no-scroll { overflow: hidden; }

    </style>
</head>
<body>

    <div class="content-container">
        <!-- 頁首區塊 -->
        <header id="main-header" class="mb-6 md:mb-8">
            <div class="flex justify-between items-end mb-2 mono-text text-[10px] md:text-[11px] font-bold tracking-widest uppercase">
                <div>NODE_05 // 2026 ISSUE</div>
                <div class="hidden md:block">XIAOSTUDIO ARCHIVE</div>
                <div>PHYSICAL PROJECTS</div>
            </div>
            
            <div class="masthead-border">
                <div class="flex items-center justify-center md:justify-start">
                    <h1 class="text-[9vw] md:text-7xl lg:text-9xl font-[900] tracking-[-0.05em] uppercase leading-none">
                        PRINT<span class="ampersand mx-[-0.05em] md:mx-[-0.02em] text-[0.85em] align-[0.05em]">&</span>PACKAGING
                    </h1>
                </div>
            </div>
            
            <div class="mt-4 flex justify-between mono-text text-[9px] md:text-[10px] font-medium tracking-wider uppercase opacity-60">
                <span>Specializing in Graphic Design & Layout</span>
                <span>VOL. 001</span>
            </div>
        </header>

        <!-- 作品展示網格 -->
        <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <!-- 專案 01 -->
            <a href="https://xiaostudio.xyz/print/ar-zine" class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/image/upload/q_auto/f_auto/v1776344739/AR-zine-01_tcduwr.jpg">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" alt="AR VISUAL" class="project-image auto-thumb">
                </div>
            </a>
            
            <!-- 佔位專案 (待補充) -->
            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/image/upload/v1774519177/soon_sumlkv.jpg">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-image auto-thumb grayscale opacity-40">
                </div>
            </div>

            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/image/upload/v1774519177/soon_sumlkv.jpg">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-image auto-thumb grayscale opacity-40">
                </div>
            </div>

            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/image/upload/v1774519177/soon_sumlkv.jpg">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-image auto-thumb grayscale opacity-40">
                </div>
            </div>
            
            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/image/upload/v1774519177/soon_sumlkv.jpg">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-image auto-thumb grayscale opacity-40">
                </div>
            </div>

            <div class="project-card reveal" data-thumb="https://res.cloudinary.com/dssycfvxr/image/upload/v1774519177/soon_sumlkv.jpg">
                <div class="project-image-container aspect-square md:aspect-[4/3]">
                    <div class="loading-shimmer"></div>
                    <img src="" class="project-image auto-thumb grayscale opacity-40">
                </div>
            </div>
        </div>
    </div>

    <!-- 專案內容載入視窗 -->
    <div id="project-overlay">
        <div class="project-modal-content">
            <div class="close-project-btn" onclick="closeProject()" title="關閉專案">✕</div>
            <iframe id="project-iframe" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        /**
         * 開啟專案詳情
         * 計算 header 位置以確保內容對齊標題下方
         */
        function openProject(url) {
            const header = document.getElementById('main-header');
            const overlay = document.getElementById('project-overlay');
            const iframe = document.getElementById('project-iframe');
            
            const headerRect = header.getBoundingClientRect();
            const headerBottom = headerRect.bottom + 20; 
            
            overlay.style.top = headerBottom + 'px';
            
            iframe.src = url;
            overlay.classList.add('active');
            document.body.classList.add('no-scroll');
        }

        /**
         * 關閉專案詳情
         */
        function closeProject() {
            const overlay = document.getElementById('project-overlay');
            const iframe = document.getElementById('project-iframe');
            overlay.classList.remove('active');
            document.body.classList.remove('no-scroll');
            // 延遲清空 src 以確保動畫流暢
            setTimeout(() => { iframe.src = ''; }, 600);
        }

        /**
         * 初始化畫廊效果
         * 使用 IntersectionObserver 達成滾動揭示與懶加載
         */
        function initGallery() {
            const cards = document.querySelectorAll('.project-card');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        const img = entry.target.querySelector('.auto-thumb');
                        const thumbUrl = entry.target.getAttribute('data-thumb');
                        
                        if (img && thumbUrl && !img.src) {
                            img.src = thumbUrl;
                            img.onload = () => {
                                img.classList.add('loaded');
                                const shimmer = entry.target.querySelector('.loading-shimmer');
                                if (shimmer) shimmer.style.opacity = '0';
                            };
                        }
                    }
                });
            }, { threshold: 0.1 });

            cards.forEach(card => {
                observer.observe(card);
                if (card.tagName === 'A') {
                    card.onclick = (e) => {
                        e.preventDefault();
                        openProject(card.getAttribute('href'));
                    };
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initGallery);
        
        // 視窗縮放時重新計算 overlay 位置
        window.addEventListener('resize', () => {
            const overlay = document.getElementById('project-overlay');
            if (overlay.classList.contains('active')) {
                const header = document.getElementById('main-header');
                const headerRect = header.getBoundingClientRect();
                overlay.style.top = (headerRect.bottom + 20) + 'px';
            }
        });
    </script>
</body>
</html>
