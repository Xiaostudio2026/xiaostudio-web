<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoStudio | TREE HOUSE 2026 - Yearbook demo #03</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #000000;
            scroll-behavior: smooth;
        }

        /* 滾動動畫效果定義 */
        .reveal-item {
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        /* 各種動畫進入方向 */
        .fade-in-up {
            transform: translateY(40px);
        }

        /* 當元素進入視口時啟動動畫 */
        .reveal-item.is-visible {
            opacity: 1;
            transform: translate(0, 0);
        }

        /* 圖片容器與懸停縮放效果 */
        .image-container {
            overflow: hidden;
            background-color: #f7f7f7;
            border-radius: 4px;
            scroll-margin-top: 80px; /* 滾動定位時保留上方間距，避免貼頂 */
        }

        .project-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .image-container:hover .project-image {
            transform: scale(1.02);
        }

        /* 頁首主視覺動畫 */
        .hero-reveal {
            opacity: 0;
            transform: scale(1.05);
            transition: transform 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
        }

        .hero-reveal.is-visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="selection:bg-gray-200">

    <!-- 專案主視覺 (Hero Image) - 手機版改為 4:3 比例，桌機端保持 60vh 高度 -->
    <section class="w-full aspect-[4/3] md:aspect-auto md:h-[60vh] overflow-hidden bg-gray-100 relative">
        <div class="hero-reveal w-full h-full">
            <img 
                src="https://res.cloudinary.com/dssycfvxr/image/upload/v1785422918/book_demo_02_ekawjl.jpg" 
                alt="[TH2026]" 
                class="w-full h-full object-cover grayscale-[0.1]"
            >
        </div>
    </section>

    <!-- 內容區塊 -->
    <main class="max-w-[1400px] mx-auto px-8 py-20 md:py-32 space-y-24">
        
        <!-- 專案標題與敘述 -->
        <section class="max-w-5xl mx-auto">
            <div class="reveal-item fade-in-up mb-6">
                <span class="text-[10px] text-gray-800 font-bold tracking-[0.3em] uppercase mb-2 block">Category: Print Design</span>
                <!-- 精緻化的標題排版層次 -->
                <h1 class="text-black text-5xl md:text-8xl font-black uppercase tracking-tighter leading-[0.9]">
                    TREE HOUSE <span class="font-light text-gray-400 text-4xl md:text-7xl block md:inline">2026</span> <br class="hidden md:block">
                    <span class="text-xl md:text-4xl font-normal tracking-normal text-gray-500 block mt-3">EDITORIAL & BRAND VISUAL ARCHIVING<br>DEMO#03</span>
                </h1>
            </div>

            <!-- 關鍵字標籤 -->
            <div class="flex flex-wrap gap-2 mb-12 reveal-item fade-in-up">
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 樹屋</span>
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 自然</span>
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 復古</span>
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 童年</span>
            </div>

            <!-- 專案簡介區塊 -->
            <div class="flex flex-col md:flex-row gap-16 border-b border-gray-100 pb-16 reveal-item fade-in-up">
                <div class="md:w-1/3 text-[10px] uppercase tracking-[0.3em] text-gray-800 font-bold border-t md:border-t-0 pt-6 md:pt-0">
                    Services
                    <div class="mt-4 space-y-2 text-[13px] text-gray-600 font-medium normal-case tracking-normal">
                        <p>Visual Integration</p>
                        <p>Visual Design</p>
                        <p>Packaging & Print</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 圖片展示網格 (透過 JS 自動不重複渲染) -->
        <div id="main-gallery-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16">
            <!-- 圖片將由 JavaScript 動態生成 -->
        </div>

        <!-- 縮圖總覽快速導覽區塊 -->
        <section class="reveal-item fade-in-up border-t border-gray-100 pt-16 mt-32">
            <div class="mb-10">
                <span class="text-[10px] text-gray-400 font-bold tracking-[0.3em] uppercase mb-1 block">Overview / Gallery Map</span>
                <h3 class="text-black text-2xl font-black uppercase tracking-tight">INDEX PREVIEW</h3>
            </div>

            <!-- 自適應彩色微縮圖網格容器 -->
            <div id="thumbnail-gallery-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-9 gap-4 pt-2">
                <!-- 縮圖將由 JavaScript 動態生成 -->
            </div>
        </section>
    </main>

    <!-- 頁尾版權 -->
    <footer class="w-full py-12 border-t border-gray-100 text-center text-xs text-gray-400 tracking-[0.2em] uppercase">
        &copy; 2026 XiaoStudio. All Rights Reserved.
    </footer>

    <script>
        // 原始圖片資料清單
        const rawImageList = [
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1790929141/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_31.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786532152/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_40_c6u11a.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786532151/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_14_o231et.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786532150/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_5_%E8%A4%87%E6%9C%AC_nmchiz.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786532151/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_11_ee2aul.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786532152/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_2_zfciwf.jpg",
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1790929145/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_33.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786532149/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_34_lgnaze.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786004270/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_16_ucvnts.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786003707/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_1_x2vugb.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786003706/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_3_qevuou.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786003700/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_5_kerbdk.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786003697/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_25_o8uyhe.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786531737/Portrait_01_a5i5zy.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786531737/Portrait_02_mgw0o3.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786000430/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_15_nzedix.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786000430/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_6_onnqka.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786000427/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_4_xx1m0z.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786000427/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_19_nhqzx3.jpg",
            "https://res.cloudinary.com/dssycfvxr/image/upload/v1786000426/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_32_b0wrwg.jpg",
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1790928657/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_10.jpg",
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1790928657/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_43.jpg",
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1790928657/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_7.jpg",
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1791146400/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_21.jpg",
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1791146402/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_9.jpg",
            "https://res.cloudinary.com/qddgnnyv/image/upload/v1791146402/%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F_13.jpg"
        ];

        // 自動進行圖片去重處理 (Deduplication)
        const uniqueImages = Array.from(new Set(rawImageList));

        // 動態生成主圖列表與縮圖列表
        function renderGalleries() {
            const mainGrid = document.getElementById('main-gallery-grid');
            const thumbGrid = document.getElementById('thumbnail-gallery-grid');

            mainGrid.innerHTML = '';
            thumbGrid.innerHTML = '';

            uniqueImages.forEach((url, index) => {
                const pageNumber = index + 1;
                const formattedNum = String(pageNumber).padStart(2, '0');
                
                // 1. 生成主圖區塊
                const mainImgDiv = document.createElement('div');
                mainImgDiv.id = `project-img-${pageNumber}`;
                mainImgDiv.className = 'image-container md:col-span-2 reveal-item fade-in-up';
                mainImgDiv.innerHTML = `
                    <img src="${url}" alt="[設計展示 ${pageNumber}]" class="project-image">
                `;
                mainGrid.appendChild(mainImgDiv);

                // 2. 生成導覽縮圖按鈕
                const thumbBtn = document.createElement('button');
                thumbBtn.className = 'group focus:outline-none text-left w-full';
                thumbBtn.onclick = () => scrollToImage(pageNumber);
                
                // 特定圖檔標題命名調整
                let labelText = `PAGE ${formattedNum}`;
                if (url.includes('Portrait_01')) labelText = 'PORTRAIT 01';
                else if (url.includes('Portrait_02')) labelText = 'PORTRAIT 02';

                thumbBtn.innerHTML = `
                    <div class="aspect-[3/4] w-full overflow-hidden rounded bg-gray-50 border border-gray-100 transition-all duration-300 group-hover:shadow-md group-hover:border-black">
                        <img src="${url}" alt="${formattedNum}" class="w-full h-full object-cover transition-all duration-500 group-hover:scale-105">
                    </div>
                    <span class="block text-[10px] font-bold text-gray-500 group-hover:text-black transition-colors duration-300 mt-2 truncate">${formattedNum}. ${labelText}</span>
                `;
                thumbGrid.appendChild(thumbBtn);
            });
        }

        // 設定 Intersection Observer 參數
        const observerOptions = { 
            threshold: 0.05, 
            rootMargin: "0px 0px -100px 0px" 
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        window.onload = () => {
            // 先渲染不重複的圖片
            renderGalleries();

            // 監聽主視覺與所有動態生成的展示區塊
            document.querySelectorAll('.hero-reveal, .reveal-item').forEach(el => {
                observer.observe(el);
            });
        };

        // 平滑滾動至指定的圖片
        function scrollToImage(index) {
            const element = document.getElementById(`project-img-${index}`);
            if (element) {
                element.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
            }
        }
    </script>
</body>
</html>
