<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoStudio | TREE HOUSE 2026 - Yearbook demo #01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #000000;
            scroll-behavior: smooth;
        }

        /* 滾動動畫效果定義 */
        .reveal-item {
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        /* 各種動畫進入方向 */
        .fade-in-up {
            transform: translateY(40px);
        }

        .slide-in-left {
            transform: translateX(-40px);
        }

        .slide-in-right {
            transform: translateX(40px);
        }

        /* 當元素進入視口時啟動動畫 */
        .reveal-item.is-visible {
            opacity: 1;
            transform: translate(0, 0);
        }

        /* 圖片容器與懸停縮放效果 */
        .image-container {
            overflow: hidden;
            background-color: #f7f7f7;
            border-radius: 4px;
            scroll-margin-top: 80px; /* 滾動定位時保留上方間距，避免貼頂 */
        }

        .project-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .image-container:hover .project-image {
            transform: scale(1.02);
        }

        /* 頁首主視覺動畫 */
        .hero-reveal {
            opacity: 0;
            transform: scale(1.05);
            transition: transform 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
        }

        .hero-reveal.is-visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="selection:bg-gray-200">

    <!-- 專案主視覺 (Hero Image) - 手機版改為 4:3 比例，桌機端保持 60vh 高度 -->
    <section class="w-full aspect-[4/3] md:aspect-auto md:h-[60vh] overflow-hidden bg-gray-100 relative">
        <div class="hero-reveal w-full h-full">
            <img 
                src="https://res.cloudinary.com/qddgnnyv/image/upload/v1795256449/Cover_front.jpg" 
                alt="[TH2026]" 
                class="w-full h-full object-cover grayscale-[0.1]"
            >
        </div>
    </section>

    <!-- 內容區塊 -->
    <main class="max-w-[1400px] mx-auto px-8 py-20 md:py-32 space-y-24">
        
        <!-- 專案標題與敘述 -->
        <section class="max-w-5xl mx-auto">
            <div class="reveal-item fade-in-up mb-6">
                <span class="text-[10px] text-gray-800 font-bold tracking-[0.3em] uppercase mb-2 block">Category: Print Design</span>
                <!-- 精緻化的標題排版層次 -->
                <h1 class="text-black text-5xl md:text-8xl font-black uppercase tracking-tighter leading-[0.9]">
                    TREE HOUSE <span class="font-light text-gray-400 text-4xl md:text-7xl block md:inline">2026</span> <br class="hidden md:block">
                    <span class="text-xl md:text-4xl font-normal tracking-normal text-gray-500 block mt-3">EDITORIAL & BRAND VISUAL ARCHIVING<br>DEMO#02</span>
                </h1>
            </div>

            <!-- 關鍵字標籤 -->
            <div class="flex flex-wrap gap-2 mb-12 reveal-item fade-in-up">
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 樹屋</span>
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 自然</span>
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 復古</span>
                <span class="px-4 py-1.5 border border-gray-200 text-[10px] uppercase tracking-[0.2em] font-bold text-gray-800"># 童年</span>
            </div>

            <!-- 專案簡介區塊 -->
            <div class="flex flex-col md:flex-row gap-16 border-b border-gray-100 pb-16 reveal-item fade-in-up">
                <div class="md:w-1/3 text-[10px] uppercase tracking-[0.3em] text-gray-800 font-bold border-t md:border-t-0 pt-6 md:pt-0">
                    Services
                    <div class="mt-4 space-y-2 text-[13px] text-gray-600 font-medium normal-case tracking-normal">
                        <p>Visual Integration</p>
                        <p>Visual Design</p>
                        <p>Packaging & Print</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 年鑑內頁 2026_01 至 2026_029 -->
        <div id="yearbook-pages" class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16"></div>

        <!-- 內頁縮圖導覽 -->
        <section class="reveal-item fade-in-up border-t border-gray-100 pt-16 mt-32">
            <div class="mb-10">
                <span class="text-[10px] text-gray-400 font-bold tracking-[0.3em] uppercase mb-1 block">Overview / Gallery Map</span>
                <h3 class="text-black text-2xl font-black uppercase tracking-tight">INDEX PREVIEW</h3>
            </div>
            <div id="yearbook-index" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-9 gap-4 pt-2"></div>
        </section>

        <!-- 封底 -->
        <section class="image-container reveal-item fade-in-up">
            <img src="https://res.cloudinary.com/qddgnnyv/image/upload/v1795256060/Cover_back.jpg" alt="年鑑封底" class="project-image">
        </section>
    </main>

    <!-- 頁尾版權 -->
    <footer class="w-full py-12 border-t border-gray-100 text-center text-xs text-gray-400 tracking-[0.2em] uppercase">
        &copy; 2026 XiaoStudio. All Rights Reserved.
    </footer>

    <script>
        // 依序載入 2026_01.jpg 至 2026_029.jpg
        const pageBaseUrl = 'https://res.cloudinary.com/qddgnnyv/image/upload/v1795256236/';
        const pagesContainer = document.getElementById('yearbook-pages');
        const indexContainer = document.getElementById('yearbook-index');

        for (let page = 1; page <= 29; page++) {
            const fileNumber = page < 10 ? String(page).padStart(2, '0') : String(page).padStart(3, '0');
            const fileName = `2026_${fileNumber}.jpg`;
            const imageUrl = `${pageBaseUrl}${fileName}`;

            const imageContainer = document.createElement('div');
            imageContainer.id = `project-img-${page}`;
            imageContainer.className = 'image-container md:col-span-2 reveal-item fade-in-up';
            imageContainer.innerHTML = `<img src="${imageUrl}" alt="年鑑內頁 ${fileName}" class="project-image" loading="lazy">`;
            pagesContainer.appendChild(imageContainer);

            const thumbnail = document.createElement('button');
            thumbnail.type = 'button';
            thumbnail.className = 'group focus:outline-none text-left w-full';
            thumbnail.setAttribute('onclick', `scrollToImage(${page})`);
            thumbnail.innerHTML = `
                <div class="aspect-[3/4] w-full overflow-hidden rounded bg-gray-50 border border-gray-100 transition-all duration-300 group-hover:shadow-md group-hover:border-black">
                    <img src="${imageUrl}" alt="${fileName}" class="w-full h-full object-cover transition-all duration-500 group-hover:scale-105" loading="lazy">
                </div>
                <span class="block text-[10px] font-bold text-gray-500 group-hover:text-black transition-colors duration-300 mt-2 truncate">${fileName}</span>`;
            indexContainer.appendChild(thumbnail);
        }

        // 設定 Intersection Observer 參數
        const observerOptions = { 
            threshold: 0.05, 
            rootMargin: "0px 0px -100px 0px" 
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target); // 觸發後即停止監聽，避免重複動畫
                }
            });
        }, observerOptions);

        window.onload = () => {
            // 監聽主視覺與所有展示區塊
            document.querySelectorAll('.hero-reveal, .reveal-item').forEach(el => {
                observer.observe(el);
            });
        };

        // 平滑滾動至指定的圖片
        function scrollToImage(index) {
            const element = document.getElementById(`project-img-${index}`);
            if (element) {
                element.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
            }
        }
    </script>
</body>
</html>
